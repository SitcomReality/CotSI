<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CotSI — Map Analysis</title>
  <link rel="stylesheet" href="./analysis/styles/index.css">
</head>
<body>
  <div id="analysis-root">
    <!-- Controls panel -->
    <div id="controls">
      <h2>CotSI Map Analysis</h2>

      <div class="control-group">
        <h3>Seed &amp; Navigation</h3>
        <div class="control-row">
          <input type="text" id="seed-input" value="glut-17" spellcheck="false" autocomplete="off">
        </div>
        <div class="btn-row">
          <button id="btn-preset-default">glut-17</button>
          <button id="btn-preset-alt">glut-42</button>
          <button id="btn-preset-random">Random</button>
        </div>
        <div class="control-row nav-row">
          <button id="btn-prev-seed" title="Previous seed">◀ Prev</button>
          <button class="primary" id="btn-cycle-toggle">▶ Play</button>
          <button id="btn-next-seed" title="Next seed">Next ▶</button>
          <button id="btn-next-random">↻ Random</button>
        </div>
        <div class="control-row">
          <label>Speed</label>
          <input type="range" id="cycle-speed" min="0.3" max="3.0" step="0.1" value="1.0">
          <span class="slider-value" id="cycle-speed-value">1.0s</span>
        </div>
      </div>

      <div class="control-group">
        <h3>Map</h3>
        <div class="control-row">
          <label>Radius</label>
          <input type="number" id="radius-input" value="21" min="7" max="77" autocomplete="off">
        </div>
        <div class="btn-row">
          <button id="btn-radius-7">7</button>
          <button id="btn-radius-21">21</button>
          <button id="btn-radius-35">35</button>
          <button id="btn-radius-77">77</button>
        </div>
        <div class="control-row">
          <label>Biome</label>
          <select id="biome-select"></select>
        </div>
        <div class="control-row">
          <label>
            <input type="checkbox" id="multi-biome-check" checked>
            Multi-biome
          </label>
        </div>
      </div>

      <div class="control-group">
        <button class="primary" id="btn-generate">Generate Map</button>
      </div>

      <div class="control-group">
        <h3>View</h3>
        <div class="control-row">
          <label>Mode</label>
          <select id="view-mode" autocomplete="off">
            <option value="terrain">Terrain</option>
            <option value="biome">Biome regions</option>
            <option value="elevation">Elevation (height)</option>
            <option value="moisture">Moisture (adjusted)</option>
            <option value="baseMoisture">Moisture (raw base)</option>
            <option value="distributions">Distributions (histograms)</option>
            <option value="density">Feature Density</option>
            <option value="passability">Passability</option>
            <option value="rivers">Rivers</option>
            <option value="blank">No terrain</option>
          </select>
        </div>
      </div>

      <div class="control-group">
        <h3>Batch Analysis</h3>
        <div class="control-row">
          <label>Seeds</label>
          <input type="number" id="batch-count" value="50" min="2" max="500" autocomplete="off">
        </div>
        <div class="control-row">
          <label>Radii</label>
          <span class="checkbox-row">
            <label><input type="checkbox" id="batch-radius-7"> 7</label>
            <label><input type="checkbox" id="batch-radius-21" checked> 21</label>
            <label><input type="checkbox" id="batch-radius-35"> 35</label>
            <label><input type="checkbox" id="batch-radius-77"> 77</label>
          </span>
        </div>
        <div class="toggle-all-row">
          <button class="toggle-all-btn" id="btn-batch-toggle-all">Toggle All</button>
          <button class="toggle-all-btn" id="btn-batch-deselect-all">Deselect All</button>
        </div>
        <div class="batch-outputs">
          <label><input type="checkbox" id="batch-terrain" checked> Terrain dist.</label>
          <label><input type="checkbox" id="batch-traders" checked> Trader heatmap</label>
          <label><input type="checkbox" id="batch-champions"> Champion heatmap</label>
          <label><input type="checkbox" id="batch-histograms"> Pooled histograms</label>
          <label><input type="checkbox" id="batch-luts"> Quantile LUTs</label>
          <label><input type="checkbox" id="batch-frequency"> Freq. verification</label>
          <label><input type="checkbox" id="batch-snapshot" checked> Snapshot tests</label>
          <label><input type="checkbox" id="batch-seam"> Seam test</label>
          <label><input type="checkbox" id="batch-climate"> Climate coverage</label>
          <label><input type="checkbox" id="batch-thresholds" checked> Derive thresholds</label>
          <label><input type="checkbox" id="batch-spatial"> Spatial stats</label>
          <label><input type="checkbox" id="batch-correlations"> Correlations</label>
        </div>
        <button class="primary" id="btn-batch-run">Run Batch Analysis</button>
        <div id="batch-progress" class="hidden">
          <div class="progress-bar">
            <div class="progress-fill" id="batch-progress-fill"></div>
          </div>
          <div class="progress-text" id="batch-progress-text"></div>
        </div>
        <div class="btn-row download-row" style="margin-top:6px">
          <button class="primary" id="btn-download-batch-report" disabled>Download Batch Report</button>
          <button id="btn-download-luts" disabled style="font-size:0.82em">Download LUTs (~30 KB)</button>
        </div>
      </div>

      <div class="control-group">
        <h3>Export</h3>
        <div class="btn-row">
          <button id="btn-export-png">Export PNG</button>
          <button id="btn-export-json">Export JSON</button>
        </div>
      </div>
    </div>

    <!-- Map canvas area -->
    <div id="map-area">
      <canvas id="map-canvas"></canvas>
      <div id="loading">Generating...</div>
    </div>

    <!-- Right sidebar: legend + entity toggles -->
    <div id="sidebar">
      <div class="sidebar-section">
        <h3>Legend</h3>
        <div id="legend">Generate a map to see the legend.</div>
      </div>
      <div class="sidebar-section">
        <h3>Entity Overlays</h3>
        <div class="toggle-group" id="entity-toggles">
          <label class="toggle-with-key">
            <input type="checkbox" id="toggle-champs" checked>
            <span class="entity-key" data-entity="champion"></span>
            Champions
          </label>
          <label class="toggle-with-key">
            <input type="checkbox" id="toggle-mobs" checked>
            <span class="entity-key" data-entity="mob"></span>
            Mobs
          </label>
          <label class="toggle-with-key">
            <input type="checkbox" id="toggle-traders" checked>
            <span class="entity-key" data-entity="trader"></span>
            Traders
          </label>
          <label class="toggle-with-key">
            <input type="checkbox" id="toggle-bases" checked>
            <span class="entity-key" data-entity="base"></span>
            Bases
          </label>
          <label class="toggle-with-key">
            <input type="checkbox" id="toggle-features" checked>
            <span class="entity-key" data-entity="feature"></span>
            Features
          </label>
          <label class="toggle-with-key">
            <input type="checkbox" id="toggle-debris">
            <span class="entity-key" data-entity="debris"></span>
            Debris
          </label>
        </div>
      </div>
    </div>

    <!-- Stats panel -->
    <div id="stats-panel">Loading...</div>
  </div>

  <script type="module" src="./analysis/ui/main.js"></script>
</body>
</html>
