<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CotSI — Geometry Editor</title>
  <link rel="stylesheet" href="./geometryEditor/styles/index.css">
</head>
<body>
  <div id="geometry-root">
    <!-- Controls panel -->
    <aside id="controls">
      <header class="page-header">
        <h1>CotSI Geometry Editor</h1>
        <p class="page-subtitle">Descriptor preview &amp; editing</p>
      </header>

      <section class="control-group">
        <h2>Object</h2>
        <div class="filter-row">
          <input type="text" id="object-filter" placeholder="Filter objects…" spellcheck="false" autocomplete="off">
          <span class="filter-count" id="object-filter-count"></span>
        </div>
        <div class="control-row">
          <label for="object-select">Design</label>
          <select id="object-select"></select>
        </div>
        <div class="control-row" id="occupied-row">
          <label>
            <input type="checkbox" id="occupied-check">
            Occupied — center claimed
          </label>
        </div>
        <div class="control-row" id="reroll-row">
          <button id="reroll-btn">↻ Re-roll variation</button>
        </div>
      </section>

      <section class="control-group">
        <h2>Edit Design</h2>
        <div id="object-edit"></div>
      </section>

      <section class="control-group">
        <h2>Parts</h2>
        <div id="parts-edit"></div>
      </section>

      <section class="control-group">
        <h2>Selected Part</h2>
        <div id="part-inspector"></div>
      </section>

      <section class="control-group">
        <h2>Project</h2>
        <div class="control-row">
          <button id="download-btn">⬇ Download JSON</button>
        </div>
        <div class="control-row">
          <label for="load-file">Load JSON</label>
          <input type="file" id="load-file" accept=".json,.txt">
        </div>
        <div id="load-error" class="info"></div>
      </section>

      <section class="control-group">
        <h2>Preview</h2>
        <div class="control-row hint">Drag to orbit · scroll to zoom</div>
        <div id="info" class="info info-panel">Loading…</div>
      </section>
    </aside>

    <!-- 3D preview area -->
    <main id="viewport">
      <canvas id="preview-canvas"></canvas>
    </main>
  </div>

  <script type="module" src="./geometryEditor/ui/main.js"></script>
</body>
</html>
