<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CotSI — Geometry Editor</title>
  <link rel="stylesheet" href="./geometryEditor/styles/index.css">
</head>
<body>
  <div id="geometry-root">
    <!-- Top chrome: title + project actions (never scrolls away) -->
    <header id="chrome">
      <div class="chrome-title">
        <h1>CotSI Geometry Editor</h1>
        <p class="page-subtitle">Descriptor preview &amp; editing</p>
      </div>
      <div class="chrome-actions">
        <div class="chrome-actions-row">
          <button id="download-btn">⬇ Download JSON</button>
          <label class="load-btn">
            Load JSON
            <input type="file" id="load-file" accept=".json,.txt" hidden>
          </label>
        </div>
        <div class="chrome-actions-row">
          <button id="new-feature-btn" class="create-btn" type="button">＋ Feature</button>
          <button id="new-decor-btn" class="create-btn" type="button">＋ Decor</button>
          <button id="new-mob-btn" class="create-btn" type="button">＋ Mob</button>
        </div>
        <div id="load-error" class="info"></div>
      </div>
    </header>

    <!-- Object + parts browser -->
    <aside id="browser">
      <div class="browser-head">
        <h2>Objects</h2>
        <span class="filter-count" id="object-filter-count"></span>
      </div>
      <div class="filter-row">
        <input type="text" id="object-filter" placeholder="Filter objects…" spellcheck="false" autocomplete="off">
      </div>
      <nav id="object-list" aria-label="Object designs"></nav>

      <section class="parts-section">
        <h2>Parts</h2>
        <div id="parts-edit"></div>
      </section>
    </aside>

    <!-- Contextual inspector: object-level design or selected-part params -->
    <main id="inspector"></main>

    <!-- 3D preview area -->
    <section id="viewport">
      <canvas id="preview-canvas"></canvas>

      <div id="preview-tools">
        <label id="occupied-row">
          <input type="checkbox" id="occupied-check">
          Occupied — center claimed
        </label>
        <label id="floor-row">
          <input type="checkbox" id="floor-check">
          Show floor
        </label>
        <div id="reroll-row">
          <button id="reroll-btn">↻ Re-roll variation</button>
        </div>
      </div>

      <div id="preview-hud">
        <div class="hint">Drag to orbit · scroll to zoom</div>
        <div id="info" class="info info-panel">Loading…</div>
      </div>
    </section>
  </div>

  <script type="module" src="./geometryEditor/ui/main.js"></script>
</body>
</html>
