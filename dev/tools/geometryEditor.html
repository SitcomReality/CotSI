<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CotSI — Geometry Editor</title>
  <link rel="stylesheet" href="./geometryEditor/styles/index.css">
</head>
<body>
  <div id="geometry-root">
    <!-- Slim action bar: project actions on the left, object search + browser
         toggle on the right. Page identity stays in the browser tab; #load-error
         drops below the bar so messages never change the header height. -->
    <header id="chrome">
      <div class="chrome-actions">
        <span id="save-status" class="save-status" role="status" hidden></span>
        <button id="save-btn" class="create-btn" type="button" title="Saving needs the dev server — run dev/tools/geometryEditor/saveServer.sh" disabled>Save</button>
        <button id="download-btn" type="button">⬇ Download</button>
        <label class="load-btn">
          Load
          <input type="file" id="load-file" accept=".json,.txt" hidden>
        </label>
        <button id="new-feature-btn" class="create-btn" type="button">＋ Feature</button>
        <button id="new-decor-btn" class="create-btn" type="button">＋ Decor</button>
        <button id="new-mob-btn" class="create-btn" type="button">＋ Mob</button>
        <button id="new-item-btn" class="create-btn" type="button">＋ Item</button>
      </div>
      <div class="chrome-search">
        <input type="text" id="object-filter" placeholder="Filter objects…" spellcheck="false" autocomplete="off">
        <button id="browser-toggle" type="button" aria-expanded="false" aria-controls="browser" title="Show object browser">▸</button>
      </div>
      <div id="load-error" class="info" role="alert"></div>
      <div id="atlas-status" class="atlas-status" role="status" aria-live="polite" hidden></div>
    </header>

    <!-- Floating object browser: hidden until toggled from the header, then
         overlays the inspector/viewport (fixed, right-anchored under the bar).
         The search input lives in the header — focusing it opens this panel. -->
    <aside id="browser" class="floating">
      <div class="browser-head">
        <h2>Objects</h2>
        <span class="filter-count" id="object-filter-count"></span>
      </div>
      <nav id="object-list" aria-label="Object designs"></nav>
    </aside>

    <!-- Left sidebar: two columns. The selection column holds the panels that
         pick WHAT you're editing — Object identity, Parts list, Motif list
         (v6 decors). The fields column holds #fields-panel, the dynamic list
         of properties for the selected thing, so it can stay wider and scroll
         independently of the selection panels. -->
    <main id="inspector">
      <div id="inspector-select">
        <section class="inspector-panel" id="object-panel">
          <div class="panel-head" data-panel="object" role="button" tabindex="0" aria-expanded="true"
            title="Object identity — name, id, kind">
            <span class="panel-title">Object</span>
            <span class="panel-fold" aria-hidden="true">▾</span>
          </div>
          <div class="panel-body" id="object-body"></div>
        </section>
        <section class="inspector-panel" id="parts-panel">
          <div class="panel-body" id="parts-edit" aria-label="Parts list"></div>
        </section>
        <section class="inspector-panel" id="motifs-panel" hidden>
          <div class="panel-head" data-panel="motifs" role="button" tabindex="0" aria-expanded="true"
            title="Motif weights, per-biome multipliers, and the realized-share grid">
            <span class="panel-title">Motifs</span>
            <span class="panel-fold" aria-hidden="true">▾</span>
          </div>
          <div class="panel-body" id="motifs-body"></div>
        </section>
      </div>
      <section class="inspector-panel" id="fields-panel">
        <div class="panel-head" data-panel="fields" role="button" tabindex="0" aria-expanded="true"
          title="The remaining design fields — variant, cluster, size, placement, emphasis, portrait">
          <span class="panel-title">Fields</span>
          <span class="panel-fold" aria-hidden="true">▾</span>
        </div>
        <div class="panel-body" id="fields-body"></div>
      </section>
    </main>

    <!-- 3D preview area -->
    <section id="viewport">
      <canvas id="preview-canvas"></canvas>

      <!-- Preview controls: a collapsible panel pinned to the viewport's
           top-left. Tile context (biome/state) on the first row, view toggles
           + actions on the second; rows wrap on narrow panes. -->
      <div id="preview-tools">
        <div class="preview-tools-bar">
          <button id="preview-tools-toggle" type="button" aria-expanded="true" aria-controls="preview-tools-body"
            title="Hide the preview controls">▾</button>
          <span class="preview-tools-title">Preview</span>
        </div>
        <div id="preview-tools-body">
          <div class="preview-tools-row">
            <label id="biome-row">
              Biome
              <select id="biome-select" aria-label="Preview-tile biome"></select>
            </label>
            <label id="motif-row" hidden>
              Motif
              <select id="motif-select" aria-label="Editing motif"
                title="Which motif the parts list edits; forced, every slot draws it (catalog mode) — the strip switches to it"></select>
            </label>
            <label id="state-row">
              State
              <select id="state-select" aria-label="Growth-state keyframe"
                title="Preview and edit the growth-state keyframe: full = the authored values (growth 1), empty = the states.empty keyframe (growth 0) — fonts empty / fruit unripe">
                <option value="1">full — growth 1</option>
                <option value="0">empty — growth 0</option>
              </select>
            </label>
          </div>
          <div class="preview-tools-row">
            <label id="occupied-row">
              <input type="checkbox" id="occupied-check">
              Occupied
            </label>
            <label id="canonical-row">
              <input type="checkbox" id="canonical-check">
              Show all
            </label>
            <label id="strip-row">
              <input type="checkbox" id="strip-check">
              Strip
            </label>
            <label id="floor-row">
              <input type="checkbox" id="floor-check">
              Floor
            </label>
            <label id="outline-row">
              <input type="checkbox" id="outline-check">
              Outline
            </label>
            <div id="reroll-row">
              <button id="reroll-btn">↻ Re-roll</button>
            </div>
            <button id="undo-btn" type="button" title="Undo the last edit (Ctrl/Cmd+Z)">↩ Undo</button>
            <button id="reset-camera-btn" type="button" title="Reset to the in-game camera angle (keeps zoom)">⤾ Reset camera</button>
          </div>
          <div class="preview-tools-row" id="strip-controls-row">
            <label id="strip-seed-row" title="Land on (and away from) ugly hashes instead of gambling on re-roll">
              Scrub
              <input type="range" id="strip-seed" min="0" max="99" value="0">
            </label>
            <div id="strip-histogram" class="strip-histogram"></div>
          </div>
        </div>
      </div>

      <div id="preview-hud">
        <div class="hint">Click a part to select · drag its arrows to move · drag to orbit · scroll to zoom</div>
        <div id="info" class="info info-panel">Loading…</div>
      </div>
    </section>
  </div>

  <script type="module" src="./geometryEditor/ui/main.js"></script>
</body>
</html>
